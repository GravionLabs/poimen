[package]
name = "poimen"
version.workspace = true
description = "Desktop GUI for herdr: coordinate AI coding agent sessions"
authors = ["Jerome Kaufmann"]
license = "MIT"
repository = "https://github.com/GravionLabs/poimen"
rust-version = "1.98"
publish = false
edition = "2024"
default-run = "poimen"

[workspace]
members = [".", "crates/poimen-protocol", "crates/poimen-client", "crates/poimen-server"]
default-members = [".", "crates/poimen-protocol", "crates/poimen-client", "crates/poimen-server"]

[workspace.package]
# The one version of the app and the poimen-* crates; release.yml rewrites this line.
version = "0.12.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/GravionLabs/poimen"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "poimen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri-plugin-dialog = "2"
notify = "8"
sha2 = "0.10"
tauri-plugin-notification = "2"
poimen-client = { path = "crates/poimen-client" }
# First release with `month_usage` (GravionLabs/tamias#119).
tamias-core = { git = "https://github.com/GravionLabs/tamias", tag = "v0.3.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# portable-pty 0.9 creates the ConPTY without PSEUDOCONSOLE_PASSTHROUGH_MODE (#455); see
# vendor/portable-pty/POIMEN.md for the only differences.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
