[package]
name = "poimen-server"
version.workspace = true
description = "Headless daemon of poimen: spaces, tabs and the terminals it runs in PTY hosts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "poimen_server"

[[bin]]
name = "poimen-server"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
poimen-client = { path = "../poimen-client" }
poimen-core = { path = "../poimen-core" }
poimen-protocol = { path = "../poimen-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The in-process host of the tests (`PtyHost::Launch`): the real host, same protocol.
poimen-pty-host = { path = "../poimen-pty-host" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
