[package]
name = "poimen-client"
version.workspace = true
description = "Client of the poimen-server socket API: connect, requests, event stream"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
interprocess = "2.4.7"
poimen-core = { path = "../poimen-core" }
poimen-protocol = { path = "../poimen-protocol" }
serde = "1"
serde_json = "1"

[dev-dependencies]
# Test directories that remove themselves, also when the test panics (docs/agents/tests.md).
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target."cfg(windows)".dependencies]
widestring = "1.2"
