[package]
name = "poimen-client"
version.workspace = true
description = "Client of the poimen-server socket API: connect, requests, event stream"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
interprocess = "2.4.7"
poimen-protocol = { path = "../poimen-protocol" }
serde = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target."cfg(windows)".dependencies]
widestring = "1.2"
