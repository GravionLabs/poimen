[package]
name = "poimen-client"
version = "0.1.0"
description = "Client of the poimen-server socket API: connect, requests, event stream"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
poimen-protocol = { path = "../poimen-protocol" }
serde = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
