[package]
name = "poimen-core"
version.workspace = true
description = "Project, trust, template, remote and layout logic shared by the app and the server (Tauri-free)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
poimen-protocol = { path = "../poimen-protocol" }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"

[dev-dependencies]
# Test directories that remove themselves, also when the test panics (docs/agents/tests.md).
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
