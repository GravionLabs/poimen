<div class="head">
  <div class="brand">Notifications</div>
  <button
    type="button"
    class="mark"
    [disabled]="center.unread() === 0"
    (click)="center.markAllRead()"
  >
    Mark all read
  </button>
</div>
@if (center.entries().length === 0) {
  <p class="empty">No notifications yet. Agents that turn blocked or done show up here.</p>
} @else {
  <ul class="list" aria-label="Notifications">
    @for (entry of center.entries(); track entry.id) {
      <li>
        <button
          type="button"
          class="entry"
          [class.unread]="!entry.read"
          (click)="choose(entry.id, entry.paneId)"
        >
          <span class="dot status-{{ entry.status }}"></span>
          <span class="text">
            <span class="message">{{ entry.message }}</span>
            <span class="meta">{{ entry.label }}</span>
          </span>
          <time class="time" [attr.datetime]="entry.time">{{ timeOf(entry.time) }}</time>
        </button>
      </li>
    }
  </ul>
}
