<header class="bar">
  <button
    type="button"
    class="item"
    aria-haspopup="menu"
    [attr.aria-expanded]="pluginsOpen()"
    (click)="togglePlugins()"
  >
    Plugins
  </button>
  <span class="spacer"></span>
  <button
    type="button"
    class="item theme-button"
    [title]="fixedBy() ? fixed(fixedBy()!) : label(theme())"
    [attr.aria-label]="fixedBy() ? fixed(fixedBy()!) : label(theme())"
    [disabled]="fixedBy() !== null"
    (click)="themeChange.emit(next(theme()))"
  >
    @switch (theme()) {
      @case ("light") {
        <svg class="icon sun" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3" />
          <path
            d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"
          />
        </svg>
      }
      @case ("dark") {
        <svg class="icon moon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z" />
        </svg>
      }
      @default {
        <svg class="icon auto" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.5" />
          <path d="M8 2.5a5.5 5.5 0 010 11z" fill="currentColor" />
        </svg>
      }
    }
    <span>{{ theme() }}</span>
  </button>
</header>
@if (pluginsOpen()) {
  <button
    type="button"
    class="menu-backdrop"
    tabindex="-1"
    aria-label="Close menu"
    (click)="pluginsOpen.set(false)"
  ></button>
  <div class="menu" role="menu">
    @for (action of plugins(); track action.plugin_id + "/" + action.action_id) {
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        [title]="action.description ?? ''"
        (click)="choosePlugin(action)"
        (keydown.escape)="pluginsOpen.set(false)"
      >
        {{ action.title }}
        <span class="plugin">{{ action.plugin_id }}</span>
      </button>
    } @empty {
      <div class="menu-empty">{{ pluginsError() ?? "No plugin actions" }}</div>
    }
  </div>
}
