@if (actions.trust(); as pending) {
  <button
    type="button"
    class="backdrop"
    tabindex="-1"
    aria-label="Cancel"
    (click)="answer('cancel')"
  ></button>
  <div
    class="dialog trust"
    role="dialog"
    aria-modal="true"
    aria-label="Trust project"
    (keydown.escape)="answer('cancel')"
  >
    <h2>Trust this project?</h2>
    <p class="hint">
      <code>{{ pending.request.root }}</code> wants to run these commands. Only trust a repository
      you know. The trust ends when the file changes.
    </p>
    <ul class="commands" aria-label="Commands of the project file">
      @for (c of pending.request.commands; track $index) {
        <li>
          <span class="what">{{ c.what }}</span>
          <code>{{ c.command }}</code>
        </li>
      }
    </ul>
    <div class="buttons">
      <button type="button" class="cancel" (click)="answer('cancel')">Cancel</button>
      <button type="button" class="without" (click)="answer('without')">
        Run without project commands
      </button>
      <button type="button" class="confirm" (click)="answer('trust')">Trust and run</button>
    </div>
  </div>
}
