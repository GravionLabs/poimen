@if (actions.trust(); as pending) {
  <app-dialog-shell
    heading="Trust this project?"
    label="Trust project"
    width="640px"
    [alert]="true"
    [cancelDefault]="true"
    (cancelled)="answer('cancel')"
  >
    <p class="hint">
      <code>{{ pending.request.root }}</code> wants to run these commands. Only trust a repository
      you know. The trust ends when the file changes.
    </p>
    <ul class="commands" aria-label="Commands of the project file">
      @for (c of pending.request.commands; track $index) {
        <li>
          <span class="what">{{ c.what }}</span>
          <code>{{ c.command }}</code>
        </li>
      }
    </ul>
    <div class="dialog-buttons">
      <button
        type="button"
        hx-button
        variant="text"
        severity="secondary"
        class="cancel"
        (click)="answer('cancel')"
      >
        Cancel
      </button>
      <button
        type="button"
        hx-button
        variant="outlined"
        severity="secondary"
        class="without"
        (click)="answer('without')"
      >
        Run without project commands
      </button>
      <button type="button" hx-button class="confirm" (click)="answer('trust')">
        Trust and run
      </button>
    </div>
  </app-dialog-shell>
}
