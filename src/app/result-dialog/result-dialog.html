@if (state.content(); as c) {
  <app-dialog-shell [heading]="c.title" (cancelled)="state.close()">
    <p class="summary">{{ c.summary }}</p>
    @if (c.text) {
      <pre class="output" aria-label="Output">{{ c.text }}</pre>
    }
    <div class="dialog-buttons">
      <button
        type="button"
        hx-button
        [variant]="c.action ? 'outlined' : 'filled'"
        [severity]="c.action ? 'secondary' : 'primary'"
        class="close"
        (click)="state.close()"
      >
        Close
      </button>
      @if (c.action; as action) {
        <button type="button" hx-button class="confirm" (click)="state.runAction()">
          {{ action.label }}
        </button>
      }
    </div>
  </app-dialog-shell>
}
