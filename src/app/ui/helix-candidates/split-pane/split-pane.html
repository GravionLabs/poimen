@for (i of indexes(); track i) {
  <div class="pane" [style.flex-grow]="shares()[i]">
    @if (pane(); as tpl) {
      <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: i }" />
    }
  </div>
  @if (i < count() - 1) {
    <div
      class="divider"
      role="separator"
      tabindex="0"
      [attr.aria-orientation]="direction() === 'column' ? 'horizontal' : 'vertical'"
      [attr.aria-valuenow]="(shares()[i] * 100).toFixed(0)"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-label="Resize split"
      (pointerdown)="dragStart($event)"
      (pointermove)="dragMove($event, i)"
      (pointerup)="dragEnd($event)"
      (pointercancel)="dragEnd($event)"
      (keydown)="key($event, i)"
    ></div>
  }
}
