<dialog
  #dialog
  class="dialog"
  [attr.role]="alert ? 'alertdialog' : 'dialog'"
  [attr.aria-label]="label ?? heading"
  [style.width]="cssWidth"
>
  <div class="inner">
    <div class="head">
      @if (heading) {
        <h2>{{ heading }}</h2>
      } @else {
        <h2><ng-content select="[dialogHeading]" /></h2>
      }
      <button
        type="button"
        hx-button
        variant="text"
        severity="secondary"
        size="small"
        class="dialog-close"
        aria-label="Close"
        title="Close"
        (click)="cancelled.emit()"
      >
        <app-icon name="close" />
      </button>
    </div>
    <div class="body"><ng-content /></div>
  </div>
</dialog>
