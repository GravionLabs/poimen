@if (monogram; as letters) {
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="2" y="2" width="20" height="20" rx="5" />
    <text
      x="12"
      y="16"
      text-anchor="middle"
      fill="currentColor"
      stroke="none"
      font-family="system-ui, sans-serif"
      font-size="11"
      font-weight="700"
      [attr.textLength]="letters.length > 1 ? 14 : null"
      lengthAdjust="spacingAndGlyphs"
    >
      {{ letters }}
    </text>
  </svg>
} @else if (strokes; as paths) {
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    @for (d of paths; track $index) {
      <path [attr.d]="d" />
    }
  </svg>
} @else {
  <svg viewBox="0 0 24 24" fill="currentColor"><path [attr.d]="path" /></svg>
}
