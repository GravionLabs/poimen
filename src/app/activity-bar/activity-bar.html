<nav aria-label="Views">
  @for (view of views(); track view.id) {
    <button
      type="button"
      class="item"
      [class.active]="expanded() && view.id === active()"
      [attr.aria-pressed]="expanded() && view.id === active()"
      [title]="view.label"
      [attr.aria-label]="view.label"
      (click)="selected.emit(view.id)"
    >
      @switch (view.icon) {
        @case ("spaces") {
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="2" width="13" height="12" rx="1.5" />
            <path d="M6 2v12M6 8h8.5" />
          </svg>
        }
        @case ("folder") {
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1.5 4a1 1 0 011-1h4L8 5h5.5a1 1 0 011 1v6.5a1 1 0 01-1 1h-11a1 1 0 01-1-1z" />
          </svg>
        }
        @case ("bell") {
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 11.5h9l-1.2-1.8V7a3.3 3.3 0 00-6.6 0v2.7zM6.5 13.5a1.5 1.5 0 003 0" />
          </svg>
        }
        @case ("github") {
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="4" cy="3.5" r="1.5" />
            <circle cx="4" cy="12.5" r="1.5" />
            <circle cx="12" cy="12.5" r="1.5" />
            <path d="M4 5v6M12 11V6.5a2 2 0 00-2-2H8M9.5 3l-1.5 1.5L9.5 6" />
          </svg>
        }
      }
    </button>
  }
</nav>
<button
  type="button"
  class="item settings"
  title="Settings"
  aria-label="Settings"
  (click)="settingsOpened.emit()"
>
  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="2.2" stroke="currentColor" />
    <path
      stroke="currentColor"
      d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"
    />
    <circle cx="8" cy="8" r="4.6" stroke="currentColor" />
  </svg>
</button>
