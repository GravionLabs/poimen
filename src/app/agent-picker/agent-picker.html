@if (state.choices(); as choices) {
  <button
    type="button"
    class="backdrop"
    tabindex="-1"
    aria-label="Cancel"
    (click)="state.answer(null)"
  ></button>
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-label="Choose an agent"
    (keydown.escape)="state.answer(null)"
  >
    <h2>Send to which agent?</h2>
    <hx-list aria-label="Agents">
      @for (c of choices; track c.paneId) {
        <button hx-list-row type="button" (click)="state.answer(c.paneId)">
          <span class="hx-list-row-label">{{ c.label }}</span>
        </button>
      }
    </hx-list>
    <div class="buttons">
      <button
        hx-button
        type="button"
        variant="outlined"
        severity="secondary"
        size="small"
        (click)="state.answer(null)"
      >
        Cancel
      </button>
    </div>
  </div>
}
