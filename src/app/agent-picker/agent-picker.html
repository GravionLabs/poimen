@if (state.choices(); as choices) {
  <app-dialog-shell
    size="sm"
    heading="Send to which agent?"
    label="Choose an agent"
    (cancelled)="state.answer(null)"
  >
    <hx-list aria-label="Agents">
      @for (c of choices; track c.paneId) {
        <button
          hx-list-row
          type="button"
          [attr.data-dialog-focus]="$first ? '' : null"
          (click)="state.answer(c.paneId)"
        >
          <span class="hx-list-row-label">{{ c.label }}</span>
        </button>
      }
    </hx-list>
    <div class="dialog-buttons">
      <button
        hx-button
        type="button"
        variant="outlined"
        severity="secondary"
        size="small"
        (click)="state.answer(null)"
      >
        Cancel
      </button>
    </div>
  </app-dialog-shell>
}
