<ul aria-labelledby="runs-scheduled">
  @for (r of rows(); track r.key + r.terminal_id) {
    <li>
      <hx-tag severity="secondary">schedule</hx-tag>
      <strong>{{ r.mode }}</strong>
      <span class="hint">{{ r.dir }}</span>
      <hx-tag [severity]="r.severity">{{ r.outcome }}</hx-tag>
      <span>{{ r.time }}</span>
      @if (r.exit_code) {
        <span class="hint">exit code {{ r.exit_code }}</span>
      }
      @if (r.open) {
        <button
          type="button"
          hx-button
          variant="text"
          size="small"
          (click)="paneChosen.emit(r.terminal_id)"
        >
          Show terminal
        </button>
      }
    </li>
  }
</ul>
