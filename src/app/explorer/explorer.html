<div class="head">
  <div class="brand">Explorer</div>
  <input
    type="search"
    class="filter"
    placeholder="Filter folders"
    aria-label="Filter folders"
    [value]="query()"
    (input)="setQuery($event)"
    (keydown)="filterKey($event)"
  />
</div>
<hx-tree
  class="dirs"
  ariaLabel="Directories"
  selectionMode="none"
  emptyMessage="No folders"
  [value]="nodes()"
  (nodeExpand)="onExpand($event)"
  (nodeCollapse)="onCollapse($event)"
>
  <ng-template hxTreeNode let-node>
    <span
      class="dir"
      (mousedown)="select(node.key)"
      (contextmenu)="openMenu($event, node.key)"
      (dblclick)="createSpace(node.key)"
    >
      <span class="hx-tree-node-label">
        @for (part of parts(node.label); track $index) {
          <span [class.hit]="part.hit">{{ part.text }}</span>
        }
      </span>
      @if (withSpace().has(node.key)) {
        <span class="has-space" title="Has a space" aria-label="Has a space">●</span>
      }
      <button
        type="button"
        class="open-terminal"
        title="Open terminal here"
        aria-label="Open terminal here"
        (click)="$event.stopPropagation(); openTerminal(node.key)"
        (dblclick)="$event.stopPropagation()"
      >
        &gt;_
      </button>
    </span>
  </ng-template>
</hx-tree>
@if (query().trim() && nodes().length === 0) {
  <div class="empty" role="status">No matching folders</div>
}
@if (menuAt(); as at) {
  <button
    type="button"
    class="menu-backdrop"
    tabindex="-1"
    aria-label="Close menu"
    (click)="closeMenu()"
    (contextmenu)="$event.preventDefault(); closeMenu()"
  ></button>
  <div class="menu" role="menu" [style.left.px]="at.x" [style.top.px]="at.y">
    <button
      type="button"
      role="menuitem"
      class="menu-item"
      (click)="createSpace(at.path)"
      (keydown.escape)="closeMenu()"
    >
      Create space here
    </button>
    <button
      type="button"
      role="menuitem"
      class="menu-item"
      (click)="openTerminal(at.path)"
      (keydown.escape)="closeMenu()"
    >
      Open terminal here
    </button>
    @if (menuRepo() === true) {
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="showChanges(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Show changes
      </button>
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="startTask(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Start task from issue…
      </button>
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="fetchRepo(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Fetch
      </button>
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="pullRepo(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Pull
      </button>
    } @else if (menuRepo() === false) {
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="fetchAll(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Fetch all
      </button>
    }
  </div>
}
