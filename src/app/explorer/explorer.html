<div class="head">
  <div class="brand">Explorer</div>
</div>
<hx-tree
  class="dirs"
  ariaLabel="Directories"
  selectionMode="none"
  emptyMessage="No folders"
  [value]="nodes()"
  (nodeExpand)="onExpand($event)"
  (nodeCollapse)="onCollapse($event)"
>
  <ng-template hxTreeNode let-node>
    <span class="dir" (contextmenu)="openMenu($event, node.key)" (dblclick)="createSpace(node.key)">
      <span class="hx-tree-node-label">{{ node.label }}</span>
      @if (withSpace().has(node.key)) {
        <span class="has-space" title="Has a space" aria-label="Has a space">●</span>
      }
    </span>
  </ng-template>
</hx-tree>
@if (menuAt(); as at) {
  <button
    type="button"
    class="menu-backdrop"
    tabindex="-1"
    aria-label="Close menu"
    (click)="closeMenu()"
    (contextmenu)="$event.preventDefault(); closeMenu()"
  ></button>
  <div class="menu" role="menu" [style.left.px]="at.x" [style.top.px]="at.y">
    <button
      type="button"
      role="menuitem"
      class="menu-item"
      (click)="createSpace(at.path)"
      (keydown.escape)="closeMenu()"
    >
      Create space here
    </button>
    @if (menuRepo()) {
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="showChanges(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Show changes
      </button>
      <button
        type="button"
        role="menuitem"
        class="menu-item"
        (click)="startTask(at.path)"
        (keydown.escape)="closeMenu()"
      >
        Start task from issue…
      </button>
    }
  </div>
}
