<app-dialog-shell
  [heading]="original ? 'Edit machine' : 'Add machine'"
  width="520px"
  (cancelled)="machines.closeForm()"
>
  <form (submit)="submit($event)" novalidate>
    <hx-field label="Name" [error]="fieldError('name')">
      <input
        hx-input
        size="small"
        name="name"
        autocomplete="off"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </hx-field>
    <hx-field
      label="SSH target"
      hint="One host as in ~/.ssh/config; no options. No password is stored."
      [error]="fieldError('ssh')"
    >
      <input
        hx-input
        size="small"
        name="ssh"
        autocomplete="off"
        placeholder="me@host or a Host alias"
        [value]="ssh()"
        (input)="ssh.set($any($event.target).value)"
      />
    </hx-field>
    @if (suggestions().length) {
      <div class="suggestions" role="group" aria-label="Hosts of your SSH config">
        @for (h of suggestions(); track h.host) {
          <button
            type="button"
            hx-button
            size="small"
            variant="outlined"
            severity="secondary"
            class="suggestion"
            [disabled]="h.configured"
            [attr.title]="h.configured ? 'Already configured' : null"
            (click)="pick(h)"
          >
            {{ h.host }}{{ h.configured ? " (configured)" : "" }}
          </button>
        }
      </div>
    }
    <hx-field label="Repositories directory" [error]="fieldError('reposDir')">
      <input
        hx-input
        size="small"
        name="reposDir"
        autocomplete="off"
        [placeholder]="defaultReposDir"
        [value]="reposDir()"
        (input)="reposDir.set($any($event.target).value)"
      />
    </hx-field>
    @if (fieldError(null); as e) {
      <hx-message class="error" severity="error" size="small">{{ e }}</hx-message>
    }
    <div class="dialog-buttons">
      <button
        type="button"
        hx-button
        variant="text"
        severity="secondary"
        class="cancel"
        (click)="machines.closeForm()"
      >
        Cancel
      </button>
      <button type="submit" hx-button class="confirm" [disabled]="busy()">Save</button>
    </div>
  </form>
</app-dialog-shell>
