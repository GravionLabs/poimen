<footer class="bar" role="status">
  <span class="item conn {{ connection().state }}" [title]="label(connection())">
    <span class="dot"></span>{{ label(connection()) }}
  </span>
  <button
    type="button"
    class="item waiting"
    [class.any]="waiting() > 0"
    [disabled]="waiting() === 0"
    title="Jump to the next waiting agent"
    (click)="jump.emit()"
  >
    {{ waiting() }} waiting
  </button>
  @if (!panelOpen()) {
    <button
      type="button"
      class="item panel-button"
      [title]="
        panelShortcut()
          ? 'Show the output panel (' + panelShortcut() + ')'
          : 'Show the output panel'
      "
      (click)="showPanel.emit()"
    >
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 3h12v10H2zM2 9.5h12" />
      </svg>
      <span>Output</span>
    </button>
  }
  @if (notice(); as text) {
    <span class="item version warn notice" [title]="text">{{ text }}</span>
  }
  <span class="spacer"></span>
  @if (paneId(); as id) {
    <span class="item">{{ id }}</span>
    @if (mode(); as m) {
      <button
        type="button"
        class="item mode-button"
        [title]="modeHint(blocked())"
        [attr.aria-label]="modeText(m, blocked())"
        [attr.aria-pressed]="m === 'control'"
        [disabled]="!!blocked()"
        (click)="control.emit(m !== 'control')"
      >
        @if (m === "control") {
          <svg class="icon pencil" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 14l1-4 8-8 3 3-8 8-4 1zM10 3l3 3" />
          </svg>
        } @else {
          <svg class="icon lock" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 7h8v7H4zM5.5 7V5a2.5 2.5 0 015 0v2" />
          </svg>
        }
        <span>{{ modeText(m, blocked()) }}</span>
      </button>
    }
    @if (size()) {
      <span class="item">{{ sizeText(size()) }}</span>
    }
  }
  <button
    type="button"
    class="item help-button"
    aria-label="Keyboard shortcuts"
    aria-haspopup="dialog"
    [title]="
      shortcutsShortcut()
        ? 'Keyboard shortcuts (' + shortcutsShortcut() + ')'
        : 'Keyboard shortcuts'
    "
    (click)="showShortcuts.emit()"
  >
    ?
  </button>
  <span class="item version">{{ appLabel(appVersion()) }}</span>
  <span
    class="item version"
    [class.warn]="warning(info()) !== ''"
    [title]="warning(info()) || herdrLabel(info())"
    >{{ herdrLabel(info()) }}</span
  >
</footer>
