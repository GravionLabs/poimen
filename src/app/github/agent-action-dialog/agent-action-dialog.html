@let d = actions.dialog();
@if (d) {
  <app-dialog-shell
    size="md"
    [heading]="d.action.label + ' ' + targetsText()"
    [label]="d.action.label"
    data-testid="agent-action-dialog"
    (cancelled)="actions.cancelDialog()"
    (confirmed)="d.harness && actions.confirmDialog()"
  >
    @if (hasReviewExtras(d.action)) {
      <hx-field label="Mode">
        <hx-select
          size="small"
          ariaLabel="Mode"
          data-testid="dialog-mode"
          [options]="modes"
          [value]="d.where"
          (valueChange)="where($event)"
        />
      </hx-field>
      <label>
        <input
          hx-checkbox
          type="checkbox"
          data-testid="dialog-post"
          [checked]="d.post"
          (change)="post($event)"
        />
        Post review on GitHub
      </label>
    } @else if (d.action.run === "ask") {
      <hx-field label="Run in">
        <hx-select
          size="small"
          ariaLabel="Run in"
          data-testid="dialog-where"
          [options]="places"
          [value]="d.where"
          (valueChange)="where($event)"
        />
      </hx-field>
    }
    <hx-field label="Harness">
      <hx-select
        size="small"
        ariaLabel="Harness"
        data-testid="dialog-harness"
        [options]="harnessOptions()"
        [value]="d.harness"
        (valueChange)="harness($event)"
      />
    </hx-field>
    <hx-field label="Model">
      <hx-select
        size="small"
        ariaLabel="Model"
        data-testid="dialog-model"
        [options]="modelOptions()"
        [value]="d.model"
        (valueChange)="model($event)"
      />
    </hx-field>
    <div class="dialog-buttons">
      <button
        type="button"
        hx-button
        variant="outlined"
        severity="secondary"
        (click)="actions.cancelDialog()"
      >
        Cancel
      </button>
      <button
        type="button"
        hx-button
        class="primary"
        data-testid="dialog-start"
        [disabled]="!d.harness"
        (click)="actions.confirmDialog()"
      >
        Start
      </button>
    </div>
  </app-dialog-shell>
}
