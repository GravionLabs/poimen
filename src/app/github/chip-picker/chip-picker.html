<div class="picker" role="group" [attr.aria-label]="label" data-testid="chip-picker">
  <span class="name">{{ label }}</span>
  <ul class="chips">
    @for (s of selected; track s) {
      <li class="chip" data-testid="chip">
        <span>{{ s }}</span>
        <button
          type="button"
          hx-button
          variant="text"
          severity="secondary"
          size="small"
          [attr.title]="'Remove ' + s"
          [attr.aria-label]="'Remove ' + s"
          data-testid="chip-remove"
          [disabled]="disabled"
          (click)="remove.emit(s)"
        >
          ×
        </button>
      </li>
    } @empty {
      <li class="none">None</li>
    }
  </ul>
  @if (!disabled && free().length > 0) {
    <input
      type="text"
      [attr.aria-label]="'Add ' + label"
      placeholder="Add..."
      data-testid="chip-input"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); takeFirst()"
      (keydown)="move($event, 'field')"
    />
    @if (query().trim()) {
      <ul class="options" [attr.aria-label]="label + ' options'">
        @for (o of matches(); track o) {
          <li>
            <button
              type="button"
              hx-button
              variant="text"
              severity="secondary"
              size="small"
              data-testid="chip-option"
              (click)="pick(o)"
              (keydown)="move($event, $any($event.currentTarget))"
            >
              {{ o }}
            </button>
          </li>
        }
      </ul>
    }
  }
</div>
