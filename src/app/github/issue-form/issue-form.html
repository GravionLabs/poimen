@if (issues.form(); as f) {
  <form
    class="form"
    aria-label="New issue"
    data-testid="issue-form"
    (submit)="$event.preventDefault(); issues.submitForm()"
    (keydown.escape)="issues.closeForm()"
  >
    <h3>
      @if (f.parent) {
        New sub-issue of #{{ f.parent.number }} in {{ f.repo }}
      } @else {
        New issue in {{ f.repo }}
      }
    </h3>
    <label>
      Title
      <input
        type="text"
        data-testid="form-title"
        [value]="f.title"
        (input)="issues.patchForm({ title: value($event) })"
      />
    </label>
    <hx-select-button
      class="tabs"
      aria-label="Description view"
      size="small"
      [options]="viewModes"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      [value]="f.previewing ? 'preview' : 'write'"
      (valueChange)="issues.patchForm({ previewing: $event === 'preview' })"
    />
    @if (f.previewing) {
      <div class="markdown" data-testid="form-preview-body" [innerHTML]="preview()"></div>
    } @else {
      <textarea
        rows="8"
        aria-label="Description (Markdown)"
        data-testid="form-body"
        [value]="f.body"
        (input)="issues.patchForm({ body: value($event) })"
      ></textarea>
    }
    <app-chip-picker
      label="Labels"
      [selected]="f.labels"
      [options]="issues.labelOptions()"
      (add)="addLabel($event)"
      (remove)="removeLabel($event)"
    />
    <app-chip-picker
      label="Milestone"
      [selected]="f.milestone ? [f.milestone] : []"
      [options]="issues.milestoneOptions()"
      (add)="issues.patchForm({ milestone: $event })"
      (remove)="issues.patchForm({ milestone: null })"
    />
    <div class="buttons">
      <button
        type="submit"
        hx-button
        variant="filled"
        size="small"
        data-testid="form-create"
        [disabled]="!ready() || issues.busy()"
      >
        Create
      </button>
      <button
        type="button"
        hx-button
        variant="text"
        severity="secondary"
        size="small"
        data-testid="form-cancel"
        (click)="issues.closeForm()"
      >
        Cancel
      </button>
    </div>
  </form>
}
