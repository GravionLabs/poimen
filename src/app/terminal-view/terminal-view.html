@if (banner(); as reason) {
  <div class="view-banner" role="status">
    <span>Stream closed: {{ reason }}</span>
    <button
      hx-button
      variant="outlined"
      severity="secondary"
      size="small"
      (click)="reconnect(false)"
    >
      Reconnect
    </button>
    @if (mode() === "control") {
      <button
        hx-button
        variant="outlined"
        severity="warn"
        size="small"
        title="Replace the current controller of this terminal"
        (click)="reconnect(true)"
      >
        Take over
      </button>
    }
  </div>
}
<div #body class="view-body"></div>
