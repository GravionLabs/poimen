@if (isAgent()) {
  <!-- Hidden, not destroyed, in control mode: the typed text survives; the body observer refits. -->
  <app-prompt-bar [pane]="pane()" [hidden]="mode() !== 'observe'" />
}
@if (blocked(); as why) {
  @if (!banner()) {
    <div class="view-banner" role="status">
      <span>Read-only: another client controls this terminal ({{ why }})</span>
      <button
        hx-button
        variant="outlined"
        severity="warn"
        size="small"
        title="Replace the current controller of this terminal"
        (click)="reconnect(true)"
      >
        Take over
      </button>
    </div>
  }
}
@if (banner(); as reason) {
  <div class="view-banner" role="status">
    <span>Stream closed: {{ reason }}</span>
    <button
      hx-button
      variant="outlined"
      severity="secondary"
      size="small"
      (click)="reconnect(false)"
    >
      Reconnect
    </button>
    @if (mode() === "control" || blocked()) {
      <button
        hx-button
        variant="outlined"
        severity="warn"
        size="small"
        title="Replace the current controller of this terminal"
        (click)="reconnect(true)"
      >
        Take over
      </button>
    }
  </div>
}
<div class="view-pad"><div #body class="view-body"></div></div>
