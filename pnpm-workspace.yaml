allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# 7 days, in minutes: a younger release reaches neither the lockfile nor an install (GravionLabs/ci#239).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # helix-ui and helix-desktop release together; every version is exempt, so a new one needs no edit here.
  - "@gravionlabs/helix-*"
  - "@pnpm/exe.android-arm64@12.21.0"
  - "@pnpm/exe.android-x64@12.21.0"
  - "@pnpm/exe.darwin-arm64@12.21.0"
  - "@pnpm/exe.darwin-x64@12.21.0"
  - "@pnpm/exe.freebsd-x64@12.21.0"
  - "@pnpm/exe.linux-arm64-musl@12.21.0"
  - "@pnpm/exe.linux-arm64@12.21.0"
  - "@pnpm/exe.linux-ppc64@12.21.0"
  - "@pnpm/exe.linux-riscv64@12.21.0"
  - "@pnpm/exe.linux-s390x@12.21.0"
  - "@pnpm/exe.linux-x64-musl@12.21.0"
  - "@pnpm/exe.linux-x64@12.21.0"
  - "@pnpm/exe.netbsd-x64@12.21.0"
  - "@pnpm/exe.win32-arm64@12.21.0"
  - "@pnpm/exe.win32-x64@12.21.0"
  - pnpm@12.21.0
  # In the lockfile before the 7 days applied and younger than that on 2026-11-18; remove after 2026-11-20.
  - "@angular-devkit/architect@0.2202.7"
  - "@angular-devkit/core@22.2.7"
  - "@angular-devkit/schematics@22.2.7"
  - "@angular/build@22.2.7"
  - "@angular/cdk@22.2.7"
  - "@angular/cli@22.2.7"
  - "@angular/common@22.2.6"
  - "@angular/compiler-cli@22.2.6"
  - "@angular/compiler@22.2.6"
  - "@angular/core@22.2.6"
  - "@angular/forms@22.2.6"
  - "@angular/platform-browser@22.2.6"
  - "@angular/router@22.2.6"
  - "@babel/compat-data@8.1.2"
  - "@babel/generator@8.1.2"
  - "@babel/helper-string-parser@8.1.2"
  - "@babel/helpers@8.1.2"
  - "@babel/parser@8.1.2"
