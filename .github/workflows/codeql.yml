name: CodeQL

# Static analysis (advanced setup): on pushes and pull requests to release/next and main, and once a week for the
# queries added since. Findings show under Security > Code scanning. Not a required check: `ci` stays the only one.
on:
  push:
    branches: [main, release/next]
  pull_request:
    branches: [main, release/next]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
