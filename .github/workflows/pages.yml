name: Pages

# The public site on GitHub Pages (https://gravionlabs.github.io/poimen/): site/ (VitePress, self-contained with its
# own package.json and npm lockfile). The decision records of docs/ stay in the repository and are not published.
# Pull requests to main or release/** that touch the site build it as a dry run, so a dead link fails before
# the merge; a push to main deploys it (Settings -> Pages -> Source must be "GitHub Actions"). A manual run is a
# dry run too. Build, deploy and concurrency live in GravionLabs/ci; its input `deploy` (default true) is the switch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: GravionLabs/ci/.github/workflows/vitepress-pages.yml@v1
    with:
      site-path: site
