name: Renovate

# Runs Renovate from here with a token of the GravionLabs CI app (secrets CI_APP_ID and CI_APP_PRIVATE_KEY): pull
# requests opened with the default GITHUB_TOKEN do not start CI. Weekly, ahead of the "before 6am on monday" schedule
# of .github/renovate.json5 (Zurich time); hourly on Monday morning so a held-back pull request is not missed by much.
on:
  schedule:
    - cron: "0 3-4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what Renovate would do"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    if: github.repository == 'GravionLabs/poimen'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@v46
        with:
          token: ${{ steps.app.outputs.token }}
          configurationFile: .github/renovate.json5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: info
