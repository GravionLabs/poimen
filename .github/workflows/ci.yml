name: CI

# Checks of the frontend (src/), the server crates and the Tauri crate (src-tauri/). On pull requests the `changes`
# job decides from the diff which areas changed (frontend, rust, or this workflow = both); jobs of an untouched area
# are skipped. The Rust jobs follow the `rust` area: src-tauri/, rust-toolchain.toml, the root package.json (the version
# test reads it) and the frontend fixtures that Rust tests read (src/app/deliver/fixtures/); the frontend job covers the
# frontend build that the Rust jobs also run. The path rules are in scripts/changed-paths.json (also read by
# `pnpm check:changed`). The `ci` job always runs
# last and is the single check to require on a branch (green when the checks passed or were skipped for lack of
# changes in their area).
# Pushes to main run these checks through release.yml (workflow_call), so they run once per release.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: ["release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes (app files)
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      rust: ${{ steps.diff.outputs.rust }}
      compat: ${{ steps.diff.outputs.compat }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf '%s\n' frontend=true rust=true compat=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The path rules are in scripts/changed-paths.json, shared with `pnpm check:changed`.
          node scripts/check-changed.mjs --github-output "$BASE_SHA"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend (check, lint, format, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Ratchets (scripts/ratchets/, no dependencies): checks with a baseline that may only shrink. Always runs; it is cheap.
  ratchets:
    name: ratchets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ratchets/core.test.mjs scripts/check-changed.test.mjs
      - run: node scripts/ratchets/run.mjs

  # The server crates and the formatting of the whole workspace: no Tauri libraries, no frontend build.
  rust-server:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust-server (fmt, clippy, test)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # cargo fmt --check covers the whole workspace (the app crate too); clippy -D warnings and test (--locked) run
      # for the server crates only, with the toolchain of rust-toolchain.toml.
      - uses: GravionLabs/ci/rust/ci@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          working-directory: src-tauri
          packages: "poimen-protocol poimen-client poimen-server poimen-core poimen-console poimen-pty-host"

  # The app crate needs the Tauri Linux libraries and the built frontend (the Tauri macros embed frontendDist). The
  # frontend build here only satisfies those macros. This job also runs for changes to the root package.json (read by
  # the version test) and to the frontend fixtures the Rust tests read (src/app/deliver/fixtures/).
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust (app crate, clippy, test)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Tauri macros read the built frontend (frontendDist in tauri.conf.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # fmt is checked in `rust-server`.
      - uses: GravionLabs/ci/rust/ci@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          working-directory: src-tauri
          packages: "poimen-app"
          run-fmt: "false"
          tauri-linux-deps: "true"

  # The poimen backend on Windows: the server crates are tested on windows-latest (named pipes, ConPTY, cmd.exe),
  # the app crate is linted for the Windows target (its tests have Unix-only parts and run in `rust`).
  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: windows (server crates test, app clippy)
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Tauri macros read the built frontend (frontendDist in tauri.conf.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # fmt is platform-independent and checked in `rust-server`.
      - uses: GravionLabs/ci/rust/ci@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          working-directory: src-tauri
          packages: "poimen-protocol poimen-client poimen-server poimen-core poimen-console poimen-pty-host"
          run-fmt: "false"
      - name: App crate (clippy)
        shell: bash
        working-directory: src-tauri
        run: cargo clippy -p poimen-app --locked -- -D warnings

  # The last stable release against this tree, both ways (#969, ADR 0009): the server of this tree adopts a
  # poimen-pty-host built from the latest stable tag, and the client of this tree pings and attaches to that tag's
  # poimen-server (src-tauri/crates/poimen-server/tests/previous_release.rs). Runs when the protocol, the host, the
  # server or the client changed.
  previous-release:
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    name: previous-release (adopt host, talk to server)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check out and build the latest stable tag
        run: |
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -Ev -- '-' | head -n 1)
          if [ -z "$tag" ]; then echo "no stable tag found"; exit 1; fi
          echo "latest stable tag: $tag"
          git worktree add "$RUNNER_TEMP/previous" "$tag"
          (cd "$RUNNER_TEMP/previous/src-tauri" && cargo build --locked -p poimen-server -p poimen-pty-host)
          {
            echo "POIMEN_PREVIOUS_TAG=$tag"
            echo "POIMEN_PREVIOUS_RELEASE_DIR=$RUNNER_TEMP/previous/src-tauri/target/debug"
            echo "POIMEN_REQUIRE_PREVIOUS=1"
          } >> "$GITHUB_ENV"
      - name: This tree against it
        working-directory: src-tauri
        run: cargo test --locked -p poimen-server --test previous_release

  # The one check to require: green when ratchets, frontend, rust-server, rust, windows and previous-release passed or were skipped because their
  # area did not change; red when any of them (or `changes`) failed or was cancelled.
  ci:
    name: ci
    if: always()
    needs: [changes, ratchets, frontend, rust-server, rust, windows, previous-release]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended as $r"; exit 1 ;;
            esac
          done
