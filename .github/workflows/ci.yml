name: CI

# Checks of the frontend (src/), the server crates and the Tauri crate (src-tauri/). On pull requests the `changes`
# job decides from the diff which areas changed (frontend, rust, or this workflow = both); jobs of an untouched area
# are skipped. The Rust jobs follow the `rust` area only: a frontend-only change cannot break the Rust build. The `ci`
# job always runs last and is the single check to require on a branch (green when the checks passed or were skipped
# for lack of changes in their area).
# Pushes to main run these checks through release.yml (workflow_call), so they run once per release.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: ["release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes (app files)
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf '%s\n' frontend=true rust=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          frontend='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc|angular\.json|tsconfig[^/]*\.json|eslint\.config\.mjs|vitest\.[^/]*|\.prettier[^/]*|src/.*|\.github/workflows/ci\.yml)$'
          rust='^(rust-toolchain\.toml|src-tauri/.*|\.github/workflows/ci\.yml)$'
          git diff --name-only "$BASE_SHA" HEAD > changed.txt
          cat changed.txt
          f=false
          r=false
          grep -Eq "$frontend" changed.txt && f=true
          grep -Eq "$rust" changed.txt && r=true
          printf '%s\n' "frontend=$f" "rust=$r" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend (check, lint, format, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # The server crates and the formatting of the whole workspace: no Tauri libraries, no frontend build.
  rust-server:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust-server (fmt, clippy, test)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # cargo fmt --check covers the whole workspace (the app crate too); clippy -D warnings and test (--locked) run
      # for the server crates only, with the toolchain of rust-toolchain.toml.
      - uses: GravionLabs/ci/rust/ci@v1
        with:
          working-directory: src-tauri
          packages: "poimen-protocol poimen-client poimen-server"

  # The app crate needs the Tauri Linux libraries and the built frontend (the Tauri macros embed frontendDist). The
  # frontend build here only satisfies those macros, so it runs when src-tauri/ changed, not for a frontend-only change.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust (app crate, clippy, test)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # The Tauri macros read the built frontend (frontendDist in tauri.conf.json).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # fmt is checked in `rust-server`. The live tests are #[ignore]d and need a herdr server; they never run here.
      - uses: GravionLabs/ci/rust/ci@v1
        with:
          working-directory: src-tauri
          packages: "poimen"
          run-fmt: "false"
          tauri-linux-deps: "true"

  # The poimen backend on Windows: the server crates are tested on windows-latest (named pipes, ConPTY, cmd.exe),
  # the app crate is linted for the Windows target (its tests have Unix-only parts and run in `rust`).
  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: windows (server crates test, app clippy)
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # The Tauri macros read the built frontend (frontendDist in tauri.conf.json).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # fmt is platform-independent and checked in `rust-server`.
      - uses: GravionLabs/ci/rust/ci@v1
        with:
          working-directory: src-tauri
          packages: "poimen-protocol poimen-client poimen-server"
          run-fmt: "false"
      - name: App crate (clippy)
        shell: bash
        working-directory: src-tauri
        run: cargo clippy -p poimen --locked -- -D warnings

  # The one check to require: green when frontend, rust-server, rust and windows passed or were skipped because their
  # area did not change; red when any of them (or `changes`) failed or was cancelled.
  ci:
    name: ci
    if: always()
    needs: [changes, frontend, rust-server, rust, windows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended as $r"; exit 1 ;;
            esac
          done
