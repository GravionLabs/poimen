# Release on main, built from the versioning actions of GravionLabs/ci.
#
# push to main (the merge commit of the release PR release/next -> main):
#   ci.yml (frontend and Rust checks) -> determine-version (GitVersion.yml) -> gh-release: git-cliff writes CHANGELOG.md
#   and commits it to main ([skip ci]), tags v<version>, creates the GitHub Release and closes the issues delivered by
#   the release PR. Then the installers (Linux x64, macOS arm64, Windows x64) are built from the tag and attached to
#   the release. They are not code-signed yet (#45).
#
# workflow_dispatch (on a branch): builds the same installer matrix with the throw-away version 0.0.<run number>
# (MSI needs a numeric one) and creates no tag, release or commit. Pull requests never build installers.
#
# The installers use the building block of GravionLabs/ci that tauri-app.yml is made of (tauri/installers@v1), not
# the reusable workflow itself: tauri-app.yml determines the version, drafts and publishes the release and writes the
# changelog on its own (this workflow keeps the manifest commit, git-cliff notes and issue closing of gh-release)
# and assumes a Cargo workspace at the repository root (poimen's crate is src-tauri/).
#
# The release job writes the released version into package.json, src-tauri/Cargo.toml (and Cargo.lock) and
# src-tauri/tauri.conf.json before the changelog commit, so a build of the tag reports the released version.
#
# GH_PAT: classic PAT with scope `repo` of a repository admin. The `main` ruleset requires a pull request and the
# `ci` check; admins (RepositoryRole 5) are bypass actors, so the changelog commit is pushed with GH_PAT. The
# GITHUB_TOKEN cannot bypass the ruleset.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  # A release in progress is never canceled.
  cancel-in-progress: false

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
      release-id: ${{ steps.release-id.outputs.id }}
    permissions:
      contents: write # changelog commit, tag, GitHub Release
      issues: write # close-issues
      pull-requests: read # close-issues reads the release PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by GitVersion
          token: ${{ secrets.GH_PAT }} # pushes the version commit past the main ruleset

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: GitVersion.yml

      # The status bar shows the Tauri app version (tauri.conf.json), so the released version is written into the
      # manifests and committed to main before gh-release adds the changelog commit and tags that HEAD.
      - name: Set version in manifests
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version: $VERSION" >&2; exit 1; }
          sed -i -E '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          sed -i -E '/^name = "poimen"$/{n;s/^version = "[^"]*"/version = "'"$VERSION"'"/}' src-tauri/Cargo.lock
          sed -i -E '0,/"version": "[^"]*"/s//"version": "'"$VERSION"'"/' package.json src-tauri/tauri.conf.json
          git diff --quiet || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): set version $VERSION [skip ci]"
            git push origin HEAD:main
          }

      # Commits CHANGELOG.md to main, then tags that commit (create-version-tag runs inside gh-release; a tag created
      # before it would leave git-cliff's --unreleased notes empty), creates the release and closes the issues.
      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          version: ${{ steps.version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: "true"
          close-issues: "true"
          token: ${{ secrets.GH_PAT }}

      # The installers are uploaded to this release (tauri-action releaseId).
      - name: Find the release id
        id: release-id
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.semver }}
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  installers:
    name: Installers ${{ matrix.target }}
    needs: [test, release]
    # release is skipped on workflow_dispatch; on a push it must have succeeded.
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release.result) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin } # Apple Silicon; no macOS x64 build
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      # The tag carries the manifests with the released version. A dispatch builds the branch it ran on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version && format('v{0}', needs.release.outputs.version) || github.sha }}

      # poimen-server ships next to the app (bundle.externalBin in tauri.bundle.conf.json, which needs the
      # target-suffixed file at build time); the app looks beside its own executable first.
      - name: Build the poimen-server sidecar
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          scripts/prepare-sidecar.sh "${{ matrix.target }}"

      - uses: GravionLabs/ci/tauri/installers@v1
        with:
          checkout: "false"
          version: ${{ needs.release.outputs.version || format('0.0.{0}', github.run_number) }}
          target: ${{ matrix.target }}
          # Empty on workflow_dispatch: build only, upload nothing.
          release-id: ${{ needs.release.outputs.release-id }}
          cargo-toml: src-tauri/Cargo.toml
          # Signed update packages and latest.json (docs/updater.md); createUpdaterArtifacts lives in the
          # release-only bundle config, so local builds need no key.
          args: --config src-tauri/tauri.bundle.conf.json
          signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
