# Release on main, built from the versioning actions of GravionLabs/ci.
#
# push to main (the merge commit of the release PR release/next -> main):
#   ci.yml (frontend and Rust checks) -> determine-version (GitVersion.yml) -> gh-release: git-cliff writes CHANGELOG.md
#   and commits it to main ([skip ci]), tags v<version>, creates the GitHub Release and closes the issues delivered by
#   the release PR. Then the installers (Linux x64, macOS arm64, Windows x64) are built from the tag and attached to
#   the release. They are not code-signed yet (#45); the `checksums` job attaches SHA256SUMS and attests them (#522).
#
# workflow_dispatch: the channel comes from the branch (determine-version of GravionLabs/ci, input `channel: auto`).
#   release/next: <next stable>-rc<nnn> (nnn = commits since the last stable tag, zero-padded to three digits so
#   GitHub sorts the releases right): the pre-release for the manual acceptance (docs/manual-acceptance.md).
#   gh-release tags v<version> on release/next and creates a GitHub pre-release (no changelog commit, no issue
#   closing, no commit to main or release/next), and the installers are attached.
#   any other branch: <next stable>-beta<nnn>: the same installer matrix, uploaded as workflow artifacts (seven days);
#   no tag, release or commit. A dispatch on main is refused (main releases through the push).
#   A version with a suffix has no MSI (WiX needs a numeric version) and no RPM (an RPM version allows no '-').
#   rc and beta build the channel `rc` (POIMEN_CHANNEL, overlay src-tauri/tauri.rc.conf.json): "Poimen RC", which
#   installs next to the stable app with its own identifier, binaries, server socket, settings and hooks, has no
#   updater artifacts or latest.json and never updates itself; stable installs do not update to it either
#   (docs/updater.md). Pull requests never build installers.
#
# The installers use the building block of GravionLabs/ci that tauri-app.yml is made of (tauri/installers@v1), not
# the reusable workflow itself: tauri-app.yml determines the version, drafts and publishes the release and writes the
# changelog on its own (this workflow keeps the manifest commit, git-cliff notes and issue closing of gh-release)
# and assumes a Cargo workspace at the repository root (poimen's crate is src-tauri/).
#
# The release job (stable only) writes the released version into package.json, src-tauri/Cargo.toml ([workspace.package], inherited by the app and the poimen-* crates; and Cargo.lock) and
# src-tauri/tauri.conf.json before the changelog commit, so a build of the tag reports the released version.
#
# GH_PAT: classic PAT with scope `repo` of a repository admin. The `main` ruleset requires a pull request and the
# `ci` check; admins (RepositoryRole 5) are bypass actors, so the changelog commit is pushed with GH_PAT. The
# GITHUB_TOKEN cannot bypass the ruleset.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  # A release in progress is never canceled.
  cancel-in-progress: false

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
      release-id: ${{ steps.release-id.outputs.id }}
    permissions:
      contents: write # changelog commit, tag, GitHub Release
      issues: write # close-issues
      pull-requests: read # close-issues reads the release PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by GitVersion
          token: ${{ secrets.GH_PAT }} # pushes the version commit past the main ruleset

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: GitVersion.yml

      # The status bar shows the Tauri app version (tauri.conf.json), so the released version is written into the
      # manifests and committed to main before gh-release adds the changelog commit and tags that HEAD.
      - name: Set version in manifests
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version: $VERSION" >&2; exit 1; }
          sed -i -E '/^\[workspace\.package\]/,/^\[/{s/^version = "[^"]*"/version = "'"$VERSION"'"/;}' src-tauri/Cargo.toml
          sed -i -E '/^name = "poimen(-[a-z]+)*"$/{n;s/^version = "[^"]*"/version = "'"$VERSION"'"/;}' src-tauri/Cargo.lock
          sed -i -E '0,/"version": "[^"]*"/s//"version": "'"$VERSION"'"/' package.json src-tauri/tauri.conf.json
          git diff --quiet || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): set version $VERSION [skip ci]"
            git push origin HEAD:main
          }

      # Commits CHANGELOG.md to main, then tags that commit (create-version-tag runs inside gh-release; a tag created
      # before it would leave git-cliff's --unreleased notes empty), creates the release and closes the issues.
      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          version: ${{ steps.version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: "true"
          close-issues: "true"
          token: ${{ secrets.GH_PAT }}

      # The installers are uploaded to this release (tauri-action releaseId).
      - name: Find the release id
        id: release-id
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.semver }}
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  # Manual dispatch: rc on release/next (tag and GitHub pre-release only), beta elsewhere (no tag, no release). No
  # manifest or changelog commit, no issue closing; the installers set the version in their own checkout. The default
  # token pushes the tag (no branch is written).
  prerelease:
    name: Pre-release
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
      channel: ${{ steps.version.outputs.channel }}
      release-id: ${{ steps.release-id.outputs.id }}
    permissions:
      contents: write # tag, GitHub pre-release (rc only)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by GitVersion

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: GitVersion.yml

      - name: Check the channel version
        env:
          VERSION: ${{ steps.version.outputs.semver }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          [[ "$CHANNEL" =~ ^(rc|beta)$ ]] || { echo "a dispatch on $GITHUB_REF_NAME is channel '$CHANNEL'; stable releases come from the push to main" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-${CHANNEL}[0-9]{3,}$ ]] || { echo "unexpected $CHANNEL version: $VERSION" >&2; exit 1; }

      # gh-release marks the release as a pre-release because the version has a pre-release part. Without
      # update-changelog nothing is committed; the git-cliff notes only list the unreleased changes.
      - name: Create GitHub pre-release
        if: ${{ steps.version.outputs.channel == 'rc' }}
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          version: ${{ steps.version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: "false"
          close-issues: "false"

      - name: Find the release id
        id: release-id
        if: ${{ steps.version.outputs.channel == 'rc' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.semver }}
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  installers:
    name: Installers ${{ matrix.target }}
    needs: [test, release, prerelease]
    # release runs on the push, prerelease on a dispatch; the one that runs must have succeeded.
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release.result) && contains(fromJSON('["success","skipped"]'), needs.prerelease.result) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the assets to the release
    env:
      # The build-time channel (poimen-protocol `CHANNEL`): a pre-release (rc or beta) builds the side-by-side
      # "Poimen RC" app and its poimen-server-rc sidecar with their own socket, settings, state and hooks.
      POIMEN_CHANNEL: ${{ needs.prerelease.outputs.version && 'rc' || 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # rpm rejects a version with '-' (0.10.0-rc003), so a version with a suffix bundles only the .deb and the .AppImage.
          - {
              os: ubuntu-24.04,
              target: x86_64-unknown-linux-gnu,
              suffix-args: "--bundles deb,appimage",
            }
          - { os: macos-latest, target: aarch64-apple-darwin } # Apple Silicon; no macOS x64 build
          # A version with a suffix (0.10.0-rc003) is no numeric WiX version, so it bundles only the NSIS -setup.exe.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix-args: "--bundles nsis" }
    steps:
      # The tag carries the manifests with the released version.
      - uses: actions/checkout@v4
        with:
          # The tag of a stable release or an rc; a beta has no tag and builds the commit of the dispatch.
          ref: ${{ (needs.release.outputs.version || needs.prerelease.outputs.release-id) && format('v{0}', needs.release.outputs.version || needs.prerelease.outputs.version) || github.sha }}

      # poimen-server ships next to the app (bundle.externalBin in tauri.bundle.conf.json, which needs the
      # target-suffixed file at build time); the app looks beside its own executable first. On the rc channel the
      # sidecar is poimen-server-rc (externalBin of tauri.rc.conf.json).
      - name: Build the poimen-server sidecar
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          scripts/prepare-sidecar.sh "${{ matrix.target }}"

      - uses: GravionLabs/ci/tauri/installers@v1
        with:
          checkout: "false"
          version: ${{ needs.release.outputs.version || needs.prerelease.outputs.version }}
          target: ${{ matrix.target }}
          # Empty for a beta: build only, upload nothing (the next step stores the files as artifacts).
          release-id: ${{ needs.release.outputs.release-id || needs.prerelease.outputs.release-id }}
          cargo-toml: src-tauri/Cargo.toml
          # Signed update packages and latest.json (docs/updater.md); createUpdaterArtifacts lives in the
          # release-only bundle config, so local builds need no key. A pre-release adds tauri.rc.conf.json: the
          # "Poimen RC" app (own identifier, product and binary name), no updater artifacts, no update endpoint.
          args: --config src-tauri/tauri.bundle.conf.json ${{ needs.prerelease.outputs.version && format('--config src-tauri/tauri.rc.conf.json {0}', matrix.suffix-args) || '' }}
          signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # A beta has no release: the installers are workflow artifacts.
      - name: Upload the beta installers
        if: ${{ needs.prerelease.outputs.channel == 'beta' }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # poimen-server alone for Linux hosts reached over SSH (`poimen-server stdio`, #278): static musl binaries, so no
  # glibc version matters, attached as poimen-server-<version>-<target>.tar.gz. A beta has no release: workflow artifacts.
  server-linux:
    name: Server ${{ matrix.target }}
    needs: [test, release, prerelease]
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release.result) && contains(fromJSON('["success","skipped"]'), needs.prerelease.result) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the assets to the release
    env:
      POIMEN_CHANNEL: ${{ needs.prerelease.outputs.version && 'rc' || 'stable' }}
      VERSION: ${{ needs.release.outputs.version || needs.prerelease.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (needs.release.outputs.version || needs.prerelease.outputs.release-id) && format('v{0}', needs.release.outputs.version || needs.prerelease.outputs.version) || github.sha }}

      - name: Build the static server
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.target }}"
          cd src-tauri
          cargo build --release --locked -p poimen-server --target "${{ matrix.target }}"

      - name: Package
        run: |
          set -euo pipefail
          name="poimen-server-${VERSION:-$GITHUB_SHA}-${{ matrix.target }}"
          mkdir -p dist
          tar -C "src-tauri/target/${{ matrix.target }}/release" -czf "dist/$name.tar.gz" poimen-server
          # The binary must be static (no glibc) and report its version and protocol.
          file "src-tauri/target/${{ matrix.target }}/release/poimen-server"
          "src-tauri/target/${{ matrix.target }}/release/poimen-server" --version

      - name: Attach to the release
        if: ${{ needs.release.outputs.release-id || needs.prerelease.outputs.release-id }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.release.outputs.version || needs.prerelease.outputs.version }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload the beta archive
        if: ${{ !(needs.release.outputs.release-id || needs.prerelease.outputs.release-id) }}
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # SHA256SUMS over the attached installers and update archives, and a build provenance attestation over the same
  # files (#522): `gh attestation verify <file> --repo GravionLabs/poimen` shows that a download was built by this
  # workflow from the tag. The installers stay unsigned, so this is how a user checks a download. Runs only when every
  # installer was attached (a partial release gets no SHA256SUMS) and never for a beta (no release).
  checksums:
    name: Checksums and provenance
    needs: [release, prerelease, installers, server-linux]
    if: ${{ !cancelled() && needs.installers.result == 'success' && needs.server-linux.result == 'success' && (needs.release.outputs.release-id || needs.prerelease.outputs.release-id) != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # download the assets, upload SHA256SUMS
      id-token: write # Sigstore signing of the attestation
      attestations: write # store the attestation
    env:
      TAG: v${{ needs.release.outputs.version || needs.prerelease.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Test the checksum script
        run: bash scripts/release-checksums.test.sh

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir dist --repo "$GITHUB_REPOSITORY"

      - name: Write SHA256SUMS
        run: bash scripts/release-checksums.sh dist

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
