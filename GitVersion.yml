mode: ContinuousDeployment
next-version: 0.1.0

# The bump comes from Conventional Commits (versioning/determine-version of GravionLabs/ci): fix = patch, feat = minor,
# type! or BREAKING CHANGE = major. release/next has no fixed increment. The channel (stable on main, -rc<nnn> on release/*, -beta<nnn> elsewhere) comes from the branch in determine-version, not from this file. next-version seeds the first release only;
# GitVersion ignores it once a higher v* tag exists.
# Pre-release tags (v0.10.0-rc003, release.yml on release/next) are not version sources: the prefix regex
# does not match a tag with a pre-release part, so GitVersion ignores them and the next stable version is the same
# with and without pre-releases.
tag-prefix: "(?![vV]?[0-9.]+-)[vV]?"
